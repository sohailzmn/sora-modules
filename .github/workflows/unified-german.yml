name: Unified German module contract tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/shirox-unified-german-20261121]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/unified-german.test.cjs
